<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Profile - Sari-Sari Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9;
            background-image: 
                linear-gradient(rgba(25, 135, 84, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 135, 84, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, #edf2ee 0%, #f4f6f9 100%);
            background-size: 24px 24px, 24px 24px, 100% 100%;
            font-family: 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .auth-card { 
            background: white; 
            border: 1px solid #e3e6f0 !important;
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 10px 30px rgba(25, 135, 84, 0.05); 
        }
        .form-control:focus, .form-select:focus {
            border-color: #198754 !important;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.12) !important;
        }
        .btn-success {
            background: linear-gradient(135deg, #0f5132, #198754) !important;
            border: none !important;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle rounded-circle p-3 mb-2" style="width: 56px; height: 56px;">
                <i class="bi bi-person-plus text-success fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark m-0">Register Account</h3>
            <p class="text-muted small mt-1">Get started with community logistics</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 bg-danger-subtle text-danger small p-2.5 text-center rounded-3 mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold tracking-wider">CHOOSE USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-0" placeholder="e.g., mang_juan" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold tracking-wider">EMAIL ADDRESS</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-light border-0" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold tracking-wider">ACCOUNT ROLE INTENT</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person-badge"></i></span>
                    <select name="role" class="form-select bg-light border-0 fw-semibold text-dark" required>
                        <option value="customer">Regular Customer (Credit/Ledger)</option>
                        <option value="admin">Store Admin / Vendor Personnel</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2.5 rounded-3 shadow-sm">Continue to Profile Initialization</button>
            <p class="text-center small text-muted mt-4 mb-0">Already registered? <a href="{% url 'login' %}" class="text-success text-decoration-none fw-bold">Sign In Here</a></p>
        </form>
    </div>
</body>
</html>
