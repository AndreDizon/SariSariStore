<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9;
            background-image: 
                linear-gradient(rgba(25, 135, 84, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 135, 84, 0.02) 1px, transparent 1px),
                linear-gradient(180deg, #edf2ee 0%, #f4f6f9 100%);
            background-size: 24px 24px, 24px 24px, 100% 100%;
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }
        .profile-card {
            background: white;
            border: 1px solid #e3e6f0 !important;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(25, 135, 84, 0.05);
        }
        .form-control:focus, .form-select:focus {
            border-color: #198754 !important;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.12) !important;
        }
        .btn-success {
            background: linear-gradient(135deg, #0f5132, #198754) !important;
            border: none !important;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 520px;">
        <div class="profile-card card border-0 p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle rounded-circle p-3 mb-2" style="width: 56px; height: 56px;">
                    <i class="bi bi-sliders text-success fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark m-0">Initialize Metadata</h3>
                <p class="text-muted small mt-1">Provide tracking details for account authorization</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary tracking-wider">CONTACT PHONE NUMBER</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-telephone"></i></span>
                        <input type="text" name="phone_number" value="{{ profile.phone_number|default:'' }}" class="form-control bg-light border-0" required placeholder="e.g. 09123456789">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary tracking-wider">GCASH NUMBER FOR PAYMENT LOGS</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-wallet2"></i></span>
                        <input type="text" name="gcash_number" value="{{ profile.gcash_number|default:'' }}" class="form-control bg-light border-0" placeholder="Optional tracking contact">
                    </div>
                </div>

                {% if profile.role == 'admin' %}
                <div class="mb-3 p-3 bg-success-subtle bg-opacity-50 border border-success-subtle rounded-3">
                    <label class="form-label small fw-bold text-dark tracking-wider"><i class="bi bi-shop text-success me-1"></i>STORE VENTURES BRAND NAME</label>
                    <input type="text" name="store_name" value="{{ profile.store_name|default:'' }}" class="form-control bg-white" placeholder="e.g. Aling Nena's Quick Stop">
                </div>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary tracking-wider">DELIVERY LOGISTICS ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-muted align-items-start pt-2.5"><i class="bi bi-geo-alt"></i></span>
                        <textarea name="delivery_address" class="form-control bg-light border-0" rows="3" required placeholder="Street Name, Barangay, City...">{{ profile.delivery_address|default:'' }}</textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2.5 rounded-3 shadow-sm">Save Settings & Launch Dashboard</button>
            </form>
        </div>
    </div>
</body>
</html>
